name: Publish H5 to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Build Worker resources for tests
        working-directory: demo
        run: npm run build
      - name: Run business and cross-origin tests
        working-directory: demo
        run: npm test
      - name: Build H5 under demo
        working-directory: demo
        run: node scripts/build-pages.mjs ../_site/demo
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy Pages site
        id: deployment
        uses: actions/deploy-pages@v4
